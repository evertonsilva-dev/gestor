<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSV de comentários</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">ARQUEA · GESTOR</span>
        <h1>Preparar comentários</h1>
        <p>Copie os comentários manualmente e cole abaixo. O texto fica nesta extensão e é salvo localmente em CSV.</p>
      </header>

      <label for="comments">Comentários copiados</label>
      <textarea
        id="comments"
        rows="10"
        placeholder="Um comentário por linha. Para comentários com várias linhas, deixe uma linha em branco entre eles."
        spellcheck="true"
      ></textarea>

      <p id="count" class="hint" aria-live="polite">Nenhum comentário pronto.</p>
      <button id="export" type="button" disabled>Baixar CSV</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="privacy">Não coleta a página, nomes de usuário ou dados em segundo plano.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
